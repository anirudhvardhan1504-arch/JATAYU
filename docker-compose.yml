services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: jatayu-backend
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "5000"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET must be set and at least 32 characters in production}"
      JWT_TTL_SECONDS: "${JWT_TTL_SECONDS:-900}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}"
      JATAYU_AUTH_DB: "/data/jatayu_auth.db"
      PROVISIONING_KEY: "${PROVISIONING_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet:beta}"
      OPEN_METEO_BASE_URL: "${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}"
      TRUST_PROXY: "true"
    volumes:
      - jatayu_db_data:/data
    networks:
      - jatayu-internal
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: jatayu-web
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jatayu-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  jatayu_db_data:
    driver: local

networks:
  jatayu-internal:
    driver: bridge
