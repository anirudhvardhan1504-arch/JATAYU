server {
    listen 80;
    server_name localhost;

    # Root directory for static production assets
    root /usr/share/nginx/html;
    index index.html;

    # Performance and Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API Reverse Proxy Routing
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;

        # Standard proxy header propagation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Bounded timeouts (60 seconds)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Standard buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Static Cesium On-Demand Assets and Web Workers
    location /cesium/ {
        alias /usr/share/nginx/html/cesium/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Static Vite Assets (Hashed JS / CSS files)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Deny access to hidden dotfiles (.env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to database files
    location ~* \.(db|sqlite|sqlite3|wal|shm)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Client-Side SPA Fallback (Never cache index.html so releases take effect immediately)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
